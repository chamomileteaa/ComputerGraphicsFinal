<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Meow</title>

  <link rel="stylesheet" href="./styles/style.css" />
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #0b1020;
      font-family: Arial, sans-serif;
    }

    canvas {
      display: block;
    }


    #overlay {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(5, 8, 18, 0.82);
      color: white;
      z-index: 10;
      text-align: center;
      cursor: pointer;
    }

    #overlay div {
      max-width: 520px;
      padding: 32px;
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.06);
      box-shadow: 0 20px 80px rgba(0, 0, 0, 0.45);
    }

    #overlay h1 {
      margin: 0 0 12px;
      font-size: 28px;
    }

    #overlay p {
      margin: 8px 0;
      color: rgba(255, 255, 255, 0.82);
      line-height: 1.45;
    }

    #crosshair {
      position: fixed;
      left: 50%;
      top: 50%;
      width: 14px;
      height: 14px;
      transform: translate(-50%, -50%);
      pointer-events: none;
      z-index: 5;
    }

    #crosshair::before,
    #crosshair::after {
      content: "";
      position: absolute;
      background: rgba(255, 255, 255, 0.85);
    }

    #crosshair::before {
      left: 6px;
      top: 0;
      width: 2px;
      height: 14px;
    }

    #crosshair::after {
      left: 0;
      top: 6px;
      width: 14px;
      height: 2px;
    }

    #hud {
      position: fixed;
      left: 18px;
      bottom: 18px;
      color: rgba(255, 255, 255, 0.8);
      font-size: 14px;
      z-index: 6;
      line-height: 1.5;
      user-select: none;
    }
  </style>
</head>
<body>

<div id="overlay">
  <div>
    <h1>Befriend Kitty</h1>
  </div>
</div>

<div id="friendship-container">
  <div id="friendship-label">Friendship Level</div>

  <div id="friendship-bar-bg">
    <div id="friendship-bar"></div>
  </div>
</div>

<div id="crosshair"></div>

<canvas id="app"></canvas>

<script type="module" src="./src/main.js"></script>

</body>
</html>
